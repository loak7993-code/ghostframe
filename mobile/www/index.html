<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0f1117">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src http: https:;">
  <title>GhostFrame</title>
  <link rel="stylesheet" href="styles.css">
  <script src="api.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <div id="app">
    <!-- top bar -->
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">GF</span>
        <span class="brand-name">GhostFrame</span>
      </div>
      <span id="conn-pill" class="conn-pill offline">offline</span>
    </header>

    <!-- views -->
    <main class="views">

      <!-- ================= PROFILES ================= -->
      <section id="view-profiles" class="view active">
        <div class="search-wrap">
          <input id="search" type="search" placeholder="Filter profiles" autocomplete="off">
        </div>
        <div id="profile-list" class="profile-list"></div>
      </section>

      <!-- ================= DETAIL ================= -->
      <section id="view-detail" class="view">
        <div class="detail-scroll" id="detail-body">
          <div class="empty"><p>Select a profile.</p></div>
        </div>
        <div class="detail-actions">
          <button id="d-fp" class="btn btn-accent btn-block"><span>Verify Fingerprint</span></button>
          <button id="d-launch-sess" class="btn btn-primary"><span>Launch</span></button>
          <button id="d-dup" class="btn"><span>Duplicate</span></button>
          <button id="d-del" class="btn btn-danger"><span>Delete</span></button>
          <button id="d-back" class="btn btn-ghost"><span>Back</span></button>
        </div>
      </section>

      <!-- ================= SESSIONS ================= -->
      <section id="view-sessions" class="view">
        <div class="empty" id="sessions-empty">No active sessions.<br><span class="dim">Launch one from a profile.</span></div>
        <div id="session-list" class="profile-list"></div>
      </section>

      <!-- ================= SETTINGS ================= -->
      <section id="view-settings" class="view">
        <div class="settings-card">
          <h3 class="settings-title">API Server</h3>
          <label class="form-label" for="set-url">Server URL</label>
          <input id="set-url" class="input" placeholder="http://192.168.1.10:8420" autocomplete="off" autocapitalize="none" inputmode="url">
          <label class="form-label" for="set-key">API key</label>
          <input id="set-key" class="input mono" placeholder="paste x-api-key" autocomplete="off" autocapitalize="none" type="password">
          <div class="settings-row">
            <button id="btn-save-settings" class="btn btn-primary">Save</button>
            <button id="btn-test" class="btn">Test connection</button>
          </div>
          <div id="settings-status" class="settings-status dim"></div>
          <p class="muted settings-hint">GhostFrame REST API runs on port 8420 on your server.<br>Start it with <code>npm run api</code> and use the key it prints.</p>
        </div>
      </section>

    </main>

    <!-- fingerprint modal -->
    <div id="fp-sheet" class="sheet hidden">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <h3>Fingerprint verification</h3>
        <button id="fp-close" class="icon-btn" aria-label="Close"><svg viewBox="0 0 12 12" width="12" height="12"><path d="M2.5 2.5l7 7m0-7l-7 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
      </div>
      <div id="fp-body" class="sheet-body"></div>
    </div>
    <div id="fp-scrim" class="scrim hidden"></div>

    <!-- bottom nav -->
    <nav class="tabbar-nav">
      <button class="nav-btn active" data-view="view-profiles" aria-label="Profiles">
        <svg viewBox="0 0 24 24" width="20" height="20"><rect x="3" y="4" width="18" height="6" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="3" y="14" width="18" height="6" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
        <span>Profiles</span>
      </button>
      <button class="nav-btn" data-view="view-sessions" aria-label="Sessions">
        <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 7v5l3.5 2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span>Sessions</span>
      </button>
      <button class="nav-btn" data-view="view-settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 15.5A3.5 3.5 0 1 0 12 8.5a3.5 3.5 0 0 0 0 7z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M19.5 12a7.6 7.6 0 0 0-.1-1.2l2-1.6-1.5-2.6-2.4 1 -.4.7a7.4 7.4 0 0 0-1.2-.7L14 5h-4l-.8 2.6a7.4 7.4 0 0 0-1.2.7 7.6 7.6 0 0 0-1.2.7l-2.4-1-1.5 2.6 2 1.6a7.6 7.6 0 0 0 0 2.4l-2 1.6 1.5 2.6 2.4-1a7.4 7.4 0 0 0 1.2.7L10 19h4l.8-2.6a7.4 7.4 0 0 0 1.2-.7l2.4 1 1.5-2.6-2-1.6c.06-.4.1-.8.1-1.2z" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
        <span>Settings</span>
      </button>
    </nav>
  </div>

  <div id="toasts" class="toasts"></div>
</body>
</html>
